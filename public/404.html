<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找不到頁面｜Open TW</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#f6f8f6; --text:#1c2420; --muted:#56625c; }
    @media (prefers-color-scheme: dark) { :root { --bg:#17201c; --text:#e6ece8; --muted:#a3b1aa; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; text-align:center; padding:16px; }
    h1 { font-size:4rem; margin:0; font-family:"LXGW WenKai TC","BiauKai","DFKai-SB",serif; color:#3d8b66; }
    p { color:var(--muted); }
    a { display:inline-block; margin-top:12px; padding:10px 18px; background:var(--text); color:var(--bg); text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>這個網址沒有頁面。可能打錯了，或是頁面已經移除。</p>
    <a href="/">回到首頁</a>
  </main>
</body>
</html>
